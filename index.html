<script>
    let saldo = prompt('masukkan saldo: ')
    console.log(saldo)

    let hari = new Date().getDay()
    console.log(hari)
    let day
    switch (hari) {
        case 1: {
            day = "Senin"
            break
        }
        case 2: {
            day = "Selasa"
            break
        }
        case 3: {
            day = "Rabu"
            break
        }
        case 4: {
            day = "Kamis"
            break
        }
        case 5: {
            day = "Jumat"
            break
        }
        case 6: {
            day = "Sabtu"
            break
        }
        case 0: {
            day = "Minggu"
            break
        }
    }

    console.log(`Sekarang Hari ${day}`,)
</script>
